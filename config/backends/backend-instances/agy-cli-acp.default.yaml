# Optional experimental Antigravity CLI ACP backend instance.
# The wrapper is downloaded from the latest stable GitHub Release when it is not
# configured or found on PATH. Authenticate `agy` once before using the backend.
# Multi User Mode: this connector is OAuth-style and is not loaded in production multi-user.
connector: agy-cli-acp
# Agy has no startup-safe catalog command. Only explicitly listed models are
# advertised by /v1/models; keep this list synchronized with the account.
models:
  - "google/gemini-3.5-flash-high"
extra:
  # workspace_path omitted: project root comes from session auto-detection (per-request project_dir).
  model: "google/gemini-3.5-flash-high"
  process_timeout: 300
  idle_timeout: 120
  skip_permissions: true
  mcp_servers: []
  wrapper_auto_download: true
  # wrapper_cache_dir: "C:\\path\\to\\managed-tools"
  # wrapper_executable: "C:\\path\\to\\go-agy-acp-wrapper.exe"
  # agy_binary: "agy.exe"
  # wrapper_extra_args: []
