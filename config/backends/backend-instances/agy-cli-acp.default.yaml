# Optional experimental Antigravity CLI ACP backend instance.
# This workstation uses the local wrapper checkout. Authenticate `agy` once
# before using the backend.
# Multi User Mode: this connector is OAuth-style and is not loaded in production multi-user.
connector: agy-cli-acp
extra:
  # workspace_path omitted: project root comes from session auto-detection (per-request project_dir).
  model: "auto"
  # 4 hours. Forwarded to the wrapper as --timeout-seconds (agy --print-timeout).
  # agy's own print-mode default is 5 minutes and will abort long tool waits.
  process_timeout: 14400
  idle_timeout: 120
  skip_permissions: true
  mcp_servers: []
  wrapper_auto_download: true
  wrapper_executable: "C:\\Users\\Mateusz\\source\\repos\\go-agy-acp-wrapper\\go-agy-acp-wrapper.exe"
  model_discovery_timeout_seconds: 30
  # wrapper_cache_dir: "C:\\path\\to\\managed-tools"
  # agy_binary: "agy.exe"
  # wrapper_extra_args: []
