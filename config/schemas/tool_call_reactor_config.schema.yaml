$schema: "http://json-schema.org/draft-07/schema#"
title: Tool Call Reactor Config
type: object
additionalProperties: false
properties:
  enabled:
    type: boolean
  apply_diff_steering_enabled:
    type: boolean
  apply_diff_steering_rate_limit_seconds:
    type: integer
    minimum: 0
  apply_diff_steering_message:
    type:
      - string
      - "null"
  pytest_full_suite_steering_enabled:
    type: boolean
  pytest_full_suite_steering_message:
    type:
      - string
      - "null"
  steering_rules:
    type: array
    items:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
        triggers:
          type: object
          additionalProperties: false
          properties:
            tool_names:
              type: array
              items: { type: string }
            phrases:
              type: array
              items: { type: string }
        message:
          type: string
        rate_limit:
          type: object
          additionalProperties: false
          properties:
            calls_per_window: { type: integer, minimum: 1 }
            window_seconds: { type: integer, minimum: 1 }
      required: [name, enabled]
  access_policies:
    type: array
    description: Tool access control policies
    items:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Unique policy identifier
        model_pattern:
          type: string
          description: Regex pattern for matching model names
        agent_pattern:
          type:
            - string
            - "null"
          description: Optional regex pattern for matching agents
        allowed_patterns:
          type: array
          items:
            type: string
          description: Regex patterns for allowed tools
          default: []
        blocked_patterns:
          type: array
          items:
            type: string
          description: Regex patterns for blocked tools
          default: []
        default_policy:
          type: string
          enum: [allow, deny]
          description: Default behavior when no patterns match
        block_message:
          type: string
          description: Message to return when blocking a tool call
          default: "This tool is not allowed by the current access policy."
        priority:
          type: integer
          description: Policy priority (higher values take precedence)
          default: 0
      required: [name, model_pattern, default_policy]
required: []
