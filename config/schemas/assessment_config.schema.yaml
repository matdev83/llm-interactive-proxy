# Schema for LLM Assessment Configuration
# This schema validates the assessment configuration section in config.yaml

$schema: http://json-schema.org/draft-07/schema#
title: LLM Assessment Configuration Schema
description: Configuration schema for LLM-based conversation assessment system

type: object
properties:
  llm_assessment:
    type: object
    description: Configuration for LLM-based conversation assessment
    properties:
      enabled:
        type: boolean
        description: Enable or disable LLM assessment system
        default: false
      
      turn_threshold:
        type: integer
        description: Number of turns before assessment is activated (replicates LLM_CHECK_AFTER_TURNS)
        minimum: 1
        maximum: 1000
        default: 30
      
      confidence_threshold:
        type: number
        description: Confidence threshold for triggering interventions
        minimum: 0.0
        maximum: 1.0
        default: 0.9
      
      backend:
        type: string
        description: Backend to use for assessment (e.g., openai, anthropic, gemini)
        minLength: 1
        examples:
          - "openai"
          - "anthropic"
          - "gemini"
      
      model:
        type: string
        description: Model to use for assessment
        minLength: 1
        examples:
          - "gpt-4o-mini"
          - "claude-3-haiku-20240307"
          - "gemini-1.5-flash"
      
      history_window:
        type: integer
        description: Number of recent conversation turns to include in assessment (replicates LLM_LOOP_CHECK_HISTORY_COUNT)
        minimum: 1
        maximum: 100
        default: 20
      
      intervals:
        type: object
        description: Assessment interval configuration
        properties:
          min:
            type: integer
            description: Minimum interval between assessments in turns (replicates MIN_LLM_CHECK_INTERVAL)
            minimum: 1
            maximum: 50
            default: 5
          
          max:
            type: integer
            description: Maximum interval between assessments in turns (replicates MAX_LLM_CHECK_INTERVAL)
            minimum: 1
            maximum: 100
            default: 15
          
          default:
            type: integer
            description: Default interval between assessments in turns (replicates DEFAULT_LLM_CHECK_INTERVAL)
            minimum: 1
            maximum: 50
            default: 3
        
        additionalProperties: false
        
        # Validation: max >= min, default >= 1
        allOf:
          - if:
              properties:
                min:
                  type: integer
                max:
                  type: integer
            then:
              properties:
                max:
                  minimum:
                    $data: "1/min"
      
      patterns:
        type: object
        description: Pattern detection configuration
        properties:
          tool_call_repetition_threshold:
            type: integer
            description: Number of identical tool calls before considering it a loop
            minimum: 2
            maximum: 20
            default: 3
          
          cognitive_loop_indicators:
            type: array
            description: Text patterns that indicate cognitive loops
            items:
              type: string
              minLength: 1
            default:
              - "I'm not sure"
              - "Let me try again"
              - "I'm confused"
              - "I don't understand"
        
        additionalProperties: false
      
      disable_for_sessions:
        type: array
        description: List of session IDs for which assessment should be disabled
        items:
          type: string
          minLength: 1
        default: []
      
      cache:
        type: object
        description: Assessment caching configuration
        properties:
          enabled:
            type: boolean
            description: Enable assessment result caching
            default: true
          
          ttl:
            type: integer
            description: Cache time-to-live in seconds
            minimum: 60
            maximum: 3600
            default: 300
          
          max_size:
            type: integer
            description: Maximum number of cached results
            minimum: 10
            maximum: 10000
            default: 1000
        
        additionalProperties: false
      
      circuit_breaker:
        type: object
        description: Circuit breaker configuration for assessment failures
        properties:
          failure_threshold:
            type: integer
            description: Number of failures before opening circuit
            minimum: 1
            maximum: 20
            default: 5
          
          timeout:
            type: integer
            description: Timeout in seconds before attempting to close circuit
            minimum: 10
            maximum: 600
            default: 60
        
        additionalProperties: false
      
      performance:
        type: object
        description: Performance tuning configuration
        properties:
          max_assessment_time:
            type: number
            description: Maximum time in seconds for assessment request
            minimum: 1.0
            maximum: 30.0
            default: 10.0
          
          async_assessment:
            type: boolean
            description: Perform assessments asynchronously to avoid blocking
            default: true
          
          batch_size:
            type: integer
            description: Maximum number of concurrent assessments
            minimum: 1
            maximum: 10
            default: 3
        
        additionalProperties: false
    
    required:
      - enabled
    
    # Conditional requirements: if enabled, backend and model are required
    if:
      properties:
        enabled:
          const: true
    then:
      required:
        - backend
        - model
    
    additionalProperties: false

# Example valid configuration
examples:
  - llm_assessment:
      enabled: true
      turn_threshold: 30
      confidence_threshold: 0.9
      backend: "openai"
      model: "gpt-4o-mini"
      history_window: 20
      intervals:
        min: 5
        max: 15
        default: 3
      patterns:
        tool_call_repetition_threshold: 3
        cognitive_loop_indicators:
          - "I'm not sure"
          - "Let me try again"
      disable_for_sessions: []
      cache:
        enabled: true
        ttl: 300
        max_size: 1000
      circuit_breaker:
        failure_threshold: 5
        timeout: 60
      performance:
        max_assessment_time: 10.0
        async_assessment: true
        batch_size: 3

  - llm_assessment:
      enabled: false

additionalProperties: true