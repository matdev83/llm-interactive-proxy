# Example Codebuff Backend Configuration
# This configuration enables the Codebuff WebSocket server for coding agent integration

# Server settings
host: "0.0.0.0"
port: 8000
proxy_timeout: 120

# Authentication
auth:
  disable_auth: false
  # API keys should be set via environment variables (see README.md)
  api_keys: []

# Codebuff WebSocket server
codebuff:
  enabled: true  # Enable Codebuff WebSocket server
  websocket_path: "/ws"  # WebSocket endpoint (default: /ws)
  heartbeat_timeout_seconds: 60  # Client heartbeat timeout
  session_cleanup_hours: 1  # Inactive session cleanup interval
  max_connections: 1000  # Maximum concurrent connections
  max_message_size_bytes: 1048576  # Maximum message size (1MB)

# Backend configuration
# Configure at least one backend for LLM requests
backends:
  default_backend: "openai"
  
  openai:
    # API key set via OPENROUTER_API_KEY environment variable
    timeout: 120
    models:
      - "gpt-3.5-turbo"
      - "gpt-4"
      - "gpt-4-turbo"
      - "gpt-4o"
  
  anthropic:
    # API key set via ANTHROPIC_API_KEY environment variable
    timeout: 150
  
  gemini:
    # API key set via GEMINI_API_KEY environment variable
    timeout: 120

# Session management
session:
  cleanup_enabled: true
  cleanup_interval: 3600  # 1 hour
  max_age: 86400  # 1 day
  default_interactive_mode: true

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  request_logging: false
  response_logging: false
  log_file: null  # Optional log file path

# Usage Example:
# 
# 1. Set environment variables:
#    export OPENAI_API_KEY="your-key-here"
#    export ANTHROPIC_API_KEY="your-key-here"
#
# 2. Start the proxy:
#    python -m src.core.cli --config config/codebuff.example.yaml
#
# 3. Connect Codebuff client:
#    codebuff --backend-url ws://localhost:8000/ws
#
# For complete documentation, see:
# - docs/user_guide/features/codebuff-backend.md
# - docs/user_guide/codebuff-protocol-reference.md
