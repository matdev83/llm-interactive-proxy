# Local development configuration

# Server settings
host: "127.0.0.1"
port: 8000
public_url: http://127.0.0.1:8000

# Authentication
auth:
  disable_auth: true
  api_keys: []

# Logging
logging:
  level: "DEBUG"
  request_logging: true
  response_logging: true
  log_file: "var/proxy-debug.log"
  cbor_capture_dir: "var/wire_captures_cbor"
  cbor_capture_session_id: "client-debug"

backends:
  default_backend: "gemini-oauth-plan"
  
  gemini-oauth-plan:
    timeout: 120

# Auxiliary request routing - route title/summary requests to a different backend
# to avoid rate limiting on the primary backend.
# Uncomment and configure to enable:
# auxiliary_routing:
#   enabled: true
#   backend: "openrouter"  # Backend to use for auxiliary requests
#   model: "google/gemini-flash-1.5"  # Optional: specific model to use
#   detection_patterns:  # Regex patterns to detect auxiliary requests
#     - "The following is the text to summarize"
#     - "Generate a (?:short |brief )?(?:title|summary)"
#   max_message_count: 3  # Max messages for a request to be considered auxiliary
