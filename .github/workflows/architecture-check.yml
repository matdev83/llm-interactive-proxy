name: Architecture Check

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  architecture-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        # Need merge-base history so PR diffs are commit-to-commit, not
        # working-tree vs origin/base (CRLF checkout noise lists the whole repo).
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Run architectural linter on changed files
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          # Get list of changed Python files in the PR (three-dot, commits only)
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep "\.py$" || true)
        else
          # Get list of changed Python files in the push
          git fetch origin ${{ github.event.before }} --depth=1
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep "\.py$" || true)
        fi
        
        if [ -z "$CHANGED_FILES" ]; then
          echo "No Python files changed, skipping architectural checks."
          exit 0
        fi
        
        echo "Checking architectural patterns in changed files:"
        echo "$CHANGED_FILES"
        
        # Run the enhanced architectural linter on each changed file
        EXIT_CODE=0
        for file in $CHANGED_FILES; do
          if [[ "$file" == tests/* ]] || [[ "$file" == */tests/* ]] || [[ "$file" == *"migrations"* ]] || [[ "$file" == *"generated"* ]]; then
            echo "Skipping test/generated file: $file"
            continue
          fi

          if [ ! -f "$file" ]; then
            echo "Skipping non-existent file (deleted/renamed): $file"
            continue
          fi
          
          echo "Checking: $file"
          python dev/scripts/architectural_linter.py "$file" || EXIT_CODE=1
        done
        
        exit $EXIT_CODE
