# Alembic Configuration for LLM Interactive Proxy
# This configuration supports async SQLModel migrations with SQLite (default)
# and can be extended for PostgreSQL or other databases.

[alembic]
# Path to migration scripts
script_location = src/core/database/migrations

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Prepend system path entries to system path (optional)
prepend_sys_path = .

# Timezone to use for revision timestamps
# timezone =

# Max length of revision IDs
# truncate_slug_length = 40

# Output encoding
# output_encoding = utf-8

# Database URL placeholder - will be overridden in env.py
sqlalchemy.url = sqlite+aiosqlite:///./var/db/proxy.db


[post_write_hooks]
# Hooks to run after revision autogenerate

# Run ruff to lint/fix auto-generated migrations
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

